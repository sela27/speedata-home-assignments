# Internal too: visitors reach the frontend through the Ingress.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "skywatch.frontend.name" . }}
  labels:
    {{- include "skywatch.labels" . | nindent 4 }}
    {{- include "skywatch.frontend.selectorLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "skywatch.frontend.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
