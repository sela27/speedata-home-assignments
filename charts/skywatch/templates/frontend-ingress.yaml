# Visitors reach the frontend through K3s's built-in Traefik, over HTTP only.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "skywatch.frontend.name" . }}
  labels:
    {{- include "skywatch.labels" . | nindent 4 }}
    {{- include "skywatch.frontend.selectorLabels" . | nindent 4 }}
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "skywatch.frontend.name" . }}
                port:
                  name: http
