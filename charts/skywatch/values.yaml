# The only values file: there are no per-environment overlays.
# Each component's config is rendered into its ConfigMap and reaches the
# container as env, so the images carry no configuration.
# No blank lines between keys: yq, which writes the Tag bump, would drop them.

frontend:
  image:
    repository: ghcr.io/sela27/skywatch-frontend
    # The Tag bump in CI sets this to the full commit SHA.
    tag: "9a7a8c70e60270a3b59323ab90eee664099d291c"
  config:
    # The backend's internal Service (templates/backend-service.yaml).
    BACKEND_URL: http://skywatch-backend
  # Measured with docker stats: 1m CPU idle, about 4 ms of CPU per page
  # (so 50m is about 12 pages/s), 67 MiB at most under load. The CPU limit is
  # a quarter of a 2-vCPU worker (about 120 pages/s). The memory request is
  # above the peak, and the limit about twice it.
  resources:
    requests:
      cpu: 50m
      memory: 80Mi
    limits:
      cpu: 500m
      memory: 128Mi
backend:
  image:
    repository: ghcr.io/sela27/skywatch-backend
    # The Tag bump in CI sets this to the full commit SHA.
    tag: "9a7a8c70e60270a3b59323ab90eee664099d291c"
  config:
    GEOCODING_URL: https://geocoding-api.open-meteo.com/v1/search
    FORECAST_URL: https://api.open-meteo.com/v1/forecast
    HTTP_TIMEOUT_SECONDS: "5"
  # Measured with docker stats: 1m CPU idle, under 1 ms of CPU per cached
  # API call, 66 MiB at most under load. The CPU request is low so the HPA's
  # 70% target (35m, about 40 calls/s per pod) is easy to reach in a demo.
  # Checked in the cluster with scripts/load.js: its load scales 2 pods to 3.
  # Limits as for the frontend; the caches grow by at most one entry per
  # Open-Meteo call, which Open-Meteo caps at 10,000 a day.
  resources:
    requests:
      cpu: 50m
      memory: 80Mi
    limits:
      cpu: 500m
      memory: 128Mi
  # The HPA (templates/backend-hpa.yaml). The target is a percentage of the CPU
  # request above.
  autoscaling:
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
ingress:
  # sslip.io resolves this name to 192.168.60.11, worker 1's Node network address.
  host: skywatch.192-168-60-11.sslip.io
