# The SkyWatch dashboard, from dashboards/skywatch.json: edit that file to change it.
# Grafana's dashboard sidecar loads every ConfigMap with this label, in any namespace
# (kube-prometheus-stack's grafana.sidecar.dashboards defaults), and updates the dashboard
# when ArgoCD syncs a change. Grafana can't save UI edits to it (allowUiUpdates: false).
# In its queries, the error rate is "(5xx or all * 0) / all" and the cache hit ratio
# "(hits or all * 0) / all": they show 0, not no data, before the first 5xx or hit (those
# series appear only then). The CPU panel's max(...) draws one request line, as every
# backend pod has the same request.
apiVersion: v1
kind: ConfigMap
metadata:
  name: skywatch-dashboard
  labels:
    grafana_dashboard: "1"
data:
  skywatch.json: |-
    {{- .Files.Get "dashboards/skywatch.json" | trim | nindent 4 }}
