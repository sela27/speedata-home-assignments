# SkyWatch's alerts. Prometheus evaluates them every 30 s and shows them on its Alerts
# page; Grafana lists them as data source-managed rules. With Alertmanager disabled
# (values.yaml) they notify no one. docs/alerts.md says how to trigger each one.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: skywatch
  labels:
    # Prometheus loads only PrometheusRules labelled with its Helm release
    # (kube-prometheus-stack's default ruleSelector).
    release: {{ .Release.Name }}
spec:
  groups:
    - name: skywatch
      rules:
        # Both read the backend's own series (service="backend", set by the app), and
        # both are true only while the last 5 minutes had requests, so an idle backend
        # raises nothing: with no requests the ratio and the quantile are NaN, which
        # compares false (and before the first 5xx the ratio has no value at all).
        - alert: SkyWatchBackendHighErrorRate
          expr: |
            sum(rate(http_requests_total{service="backend", status=~"5.."}[5m]))
              / sum(rate(http_requests_total{service="backend"}[5m]))
              > 0.05
          for: 5m
          annotations:
            summary: Over the last 5 minutes, more than 5% of backend requests are answered with a 5xx.
        # 1 s is one of the histogram's bucket boundaries (prometheus-client's defaults),
        # so this is exactly "more than 5% of requests took over 1 s": no interpolation
        # inside a bucket decides it.
        - alert: SkyWatchBackendHighLatency
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(http_request_duration_seconds_bucket{service="backend"}[5m]))
            ) > 1
          for: 5m
          annotations:
            summary: Over the last 5 minutes, the backend's p95 latency is above 1 second.
