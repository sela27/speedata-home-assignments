name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: the default token can only read the repository.
permissions:
  contents: read

# One run at a time per ref, so two Tag bumps never race. A running run may be
# mid-push, so it is never cancelled. A newer push replaces a pending run; no
# rollout is lost, because the newer commit contains the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # One job, so the check is always named "lint-test" (for branch rules and
  # later jobs' needs:). Other linters join it as plain steps.
  lint-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job never pushes, so don't leave the token in .git/config.
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Same patch version as ARG PYTHON_IMAGE (python:3.14.10-slim-trixie).
          python-version: "3.14.10"
          cache: pip
          cache-dependency-path: "*/requirements-dev.txt"

      - name: Install backend dev dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Install frontend dev dependencies
        run: pip install -r frontend/requirements-dev.txt

      - name: ruff check
        run: ruff check backend frontend

      - name: ruff format --check
        run: ruff format --check backend frontend

      # One step per service: two app.py modules must never meet in one
      # pytest session.
      - name: pytest backend
        working-directory: backend
        run: pytest

      - name: pytest frontend
        working-directory: frontend
        run: pytest

      # The same helm as the Ansible image (ansible/Dockerfile), checked against
      # the same pinned checksum. It replaces the runner's preinstalled helm
      # (/usr/local/bin/helm, an unpinned Helm 3).
      - name: Install helm
        run: |
          curl -fsSLo /tmp/helm.tar.gz https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz
          echo "0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b  /tmp/helm.tar.gz" | sha256sum --check
          sudo tar -xzf /tmp/helm.tar.gz -C /usr/local/bin --strip-components=1 linux-amd64/helm
          helm version

      - name: helm lint
        run: helm lint --strict charts/skywatch

      # Renders every template with the real values: the manifests ArgoCD
      # will apply, printed in the job log.
      - name: helm template
        run: helm template skywatch charts/skywatch

  # Both images for amd64 and arm64 on every run; pushed only on main.
  # The tag is the full commit SHA, never latest.
  build-push:
    needs: lint-test
    runs-on: ubuntu-24.04
    # The only job that may write to GHCR.
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [frontend, backend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner is amd64; QEMU emulates arm64.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR (main only)
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, and push on main
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/sela27/skywatch-${{ matrix.service }}:${{ github.sha }}
          # One cache per service, so the two builds don't overwrite each
          # other's. mode=max also keeps the builder stage (pip install).
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  # The Tag bump: once both images are in GHCR, point the app chart at them,
  # so Git always describes what should run. Main only.
  bump-tags:
    needs: build-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # The only job that may push to the repository.
    permissions:
      contents: write
    steps:
      # The tip of main, not github.sha: main may already have the previous
      # run's Tag bump, which this one must replace, not conflict with at the
      # rebase. persist-credentials stays on: the push below uses GITHUB_TOKEN.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      # Pinned and checked like helm above. The runner's own yq (/usr/bin/yq)
      # is unpinned; /usr/local/bin comes first in PATH, so this one is used.
      - name: Install yq
        run: |
          curl -fsSLo /tmp/yq https://github.com/mikefarah/yq/releases/download/v4.54.2/yq_linux_amd64
          echo "44c7759059b4910827a0059a2757b22001e59360cdecdb2ef8dedc4b6c7e9f32  /tmp/yq" | sha256sum --check
          sudo install /tmp/yq /usr/local/bin/yq
          yq --version

      # Double quotes keep the tag a string even when the SHA looks like a
      # number (all digits, or digits around one "e"). Unquoted, Helm would
      # render such a tag as a float, e.g. 1.234567890123457e+158.
      - name: Set both image tags to the commit SHA
        run: |
          yq -i '(.frontend.image.tag, .backend.image.tag) = (strenv(GITHUB_SHA) | . style="double")' \
            charts/skywatch/values.yaml
          git diff

      # A push made with GITHUB_TOKEN never starts a workflow run: that is the
      # loop guard, and [skip ci] is a second one. The rebase takes in any
      # commit pushed to main since the checkout.
      - name: Commit and push the Tag bump
        run: |
          # Re-running the latest run changes nothing, and git commit would fail.
          if git diff --quiet; then
            echo "Both tags already equal ${GITHUB_SHA}: no Tag bump needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Tag bump to ${GITHUB_SHA} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
