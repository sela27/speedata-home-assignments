name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: the default token can only read the repository.
permissions:
  contents: read

jobs:
  # One job, so the check is always named "lint-test" (for branch rules and
  # later jobs' needs:). Other linters join it as plain steps.
  lint-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job never pushes, so don't leave the token in .git/config.
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Same patch version as ARG PYTHON_IMAGE (python:3.14.10-slim-trixie).
          python-version: "3.14.10"
          cache: pip
          cache-dependency-path: "*/requirements-dev.txt"

      - name: Install backend dev dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Install frontend dev dependencies
        run: pip install -r frontend/requirements-dev.txt

      - name: ruff check
        run: ruff check backend frontend

      - name: ruff format --check
        run: ruff format --check backend frontend

      # One step per service: two app.py modules must never meet in one
      # pytest session.
      - name: pytest backend
        working-directory: backend
        run: pytest

      - name: pytest frontend
        working-directory: frontend
        run: pytest

  # Both images for amd64 and arm64 on every run; pushed only on main.
  # The tag is the full commit SHA, never latest.
  build-push:
    needs: lint-test
    runs-on: ubuntu-24.04
    # The only job that may write to GHCR.
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [frontend, backend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner is amd64; QEMU emulates arm64.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR (main only)
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, and push on main
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/sela27/skywatch-${{ matrix.service }}:${{ github.sha }}
          # One cache per service, so the two builds don't overwrite each
          # other's. mode=max also keeps the builder stage (pip install).
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
