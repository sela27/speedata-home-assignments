name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: the default token can only read the repository.
permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    strategy:
      # A red service must not cancel the other services' results.
      fail-fast: false
      matrix:
        # One entry per service directory; each runs in its own job, so two
        # app.py modules never meet in one pytest session.
        service: [backend]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job never pushes, so don't leave the token in .git/config.
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Same minor version as the service base image (python:3.14).
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements-dev.txt

      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
