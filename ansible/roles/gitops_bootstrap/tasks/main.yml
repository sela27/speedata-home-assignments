# The GitOps bootstrap: ArgoCD, the Grafana admin Secret, then the root Application.
# From then on ArgoCD deploys everything else from Git. All tasks run in the Ansible
# container and talk to the Kubernetes API with the kubeconfig k3s_server saved;
# nothing runs on the nodes.

# ArgoCD does not manage itself: its version and settings change by re-running 2-cluster.
# Two warnings on every run come from the module itself: without the helm-diff plugin it
# compares only the chart version and the values below (all this task sets), and
# kubernetes.core 6.6.0 always flags its own deprecated status.values.
- name: Install the ArgoCD chart {{ argocd_chart_version }}
  kubernetes.core.helm:
    release_name: argocd
    chart_ref: argo-cd
    chart_repo_url: https://argoproj.github.io/argo-helm
    chart_version: "{{ argocd_chart_version }}"
    release_namespace: argocd
    create_namespace: true
    kubeconfig: /state/kubeconfig
    # Returns once ArgoCD runs, so it picks up the root Application straight away.
    wait: true
    # Helm's default is 5 min per step. On the first Bring-up each worker pulls the
    # 229 MB argocd image, which took about 2 min per worker on the owner's connection.
    timeout: 10m
    release_values:
      global:
        # The chart takes the Ingress host from this. sslip.io resolves it to worker 1.
        domain: argocd.192-168-60-11.sslip.io
      configs:
        params:
          # Plain HTTP behind Traefik; this project has no TLS.
          server.insecure: true
        cm:
          # How often ArgoCD checks Git for new commits.
          timeout.reconciliation: 60s
          # The chart's default (and ArgoCD's) adds up to 60 s at random to each
          # check, to spread the load of many apps. 0 keeps the checks 60 s apart.
          timeout.reconciliation.jitter: 0s
      server:
        ingress:
          enabled: true
          ingressClassName: traefik

# Grafana's admin password (ADR-0002) is generated here, so Git never holds it. Created
# before the root Application, so it exists when ArgoCD deploys the monitoring app, whose
# Grafana reads it through admin.existingSecret. no_log: these results hold the password.
- name: Look for the Grafana admin Secret
  kubernetes.core.k8s_info:
    kind: Secret
    name: grafana-admin
    namespace: monitoring
    kubeconfig: /state/kubeconfig
  register: gitops_bootstrap_grafana_admin
  no_log: true

# Only when it is absent, so a re-run never rotates the password Grafana already uses.
# Its namespace comes with it; the monitoring app's CreateNamespace then finds it there.
- name: Create the Grafana admin Secret with a random password
  kubernetes.core.k8s:
    kubeconfig: /state/kubeconfig
    definition:
      - apiVersion: v1
        kind: Namespace
        metadata:
          name: monitoring
      - apiVersion: v1
        kind: Secret
        metadata:
          name: grafana-admin
          namespace: monitoring
        # The keys the Grafana chart reads by default (admin.userKey, admin.passwordKey).
        stringData:
          admin-user: admin
          # /dev/null: a new random password each time, not saved anywhere on the controller.
          admin-password: "{{ lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits']) }}"
  when: gitops_bootstrap_grafana_admin.resources | length == 0
  no_log: true

# Applied on every run: with no change it reports ok, and a hand edit to a field
# root-app.yaml sets is put back. It points ArgoCD at apps/ in Git, where the
# child Applications are.
- name: Apply the root Application
  kubernetes.core.k8s:
    src: root-app.yaml   # files/root-app.yaml
    kubeconfig: /state/kubeconfig
