# The K3s release on every node: the stable channel's on 2026-11-05 (update.k3s.io).
k3s_version: v1.37.2+k3s1
# The sha256 of the K3s installer at that tag. The two change together:
# https://raw.githubusercontent.com/k3s-io/k3s/<k3s_version>/install.sh
k3s_installer_sha256: ed01f89fd977bf20ac1516bbebf8370bf3ddbaa55dac8aba610956a4c78cc00b

# The ArgoCD Helm chart (argoproj/argo-helm), the latest on 2026-11-06. It installs
# Argo CD v3.6.1, which is tested on Kubernetes 1.34 to 1.37, the K3s release above included.
argocd_chart_version: 10.14.0

# Node network addresses, the ones scripts/1-vms.ps1 gives the VMs.
cp_address: 192.168.60.10
worker1_address: 192.168.60.11
worker2_address: 192.168.60.12

# The K3s API server, on the control plane's Node network address: the agents
# join it, and the host's kubeconfig points at it.
k3s_api_server_url: https://{{ cp_address }}:6443

# The default user of Ubuntu cloud images. 1-vms injects the SSH key for it.
ansible_user: ubuntu
# Ubuntu 24.04's Python. Naming it stops Ansible's interpreter discovery warning.
ansible_python_interpreter: /usr/bin/python3
